name: Web app

# Publishes the web app (web/) to GitHub Pages: the page, the card, the Python garden core and Pyodide.
on:
  push:
    branches: [main]
    paths:
      - web/**
      - custom_components/garden_tracker/core/**
      - custom_components/garden_tracker/www/**
      - custom_components/garden_tracker/manifest.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python web/build.py --download-pyodide
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
