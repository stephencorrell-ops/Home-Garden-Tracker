name: Tests

# The garden core is plain Python with no Home Assistant code, so its tests run on their own.
on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t . -v
      - run: node --check custom_components/garden_tracker/www/garden-card.js
